    // =========================================================================
    // 3. BREATHING LOGO LOADER (CHANGE 1)
    // =========================================================================
    function BreathingLogoLoader({ isLoading }) {
      const [shouldRender, setShouldRender] = useState(true);
      const [fadeClass, setFadeClass] = useState('opacity-100');

      useEffect(() => {
        if (!isLoading) {
          setFadeClass('opacity-0 pointer-events-none');
          const timer = setTimeout(() => {
            setShouldRender(false);
          }, 500); // 500ms smooth cross-fade duration
          return () => clearTimeout(timer);
        } else {
          setShouldRender(true);
          setFadeClass('opacity-100');
        }
      }, [isLoading]);

      if (!shouldRender) return null;

      return (
        <div
          className={`fixed inset-0 z-40 flex items-center justify-center bg-[#F7F3EA] transition-opacity duration-500 ease-out ${fadeClass}`}
          aria-live="polite"
          aria-busy={isLoading}
          role="status"
        >
          <div className="breathing-logo-animation flex flex-col items-center justify-center p-6 text-center">
            <Logo size="lg" />
            <div className="mt-8 font-serif text-xs font-semibold uppercase tracking-[0.25em] text-[#6B1F2A] opacity-75">
              Law Chambers of Adv. Mohsin Mohammadali Sayyed
            </div>
          </div>
        </div>
      );
    }

    // 11. APPOINTMENT FORM COMPONENT (AUTOMATIC ATTACHMENT & DISPATCH)
    // =========================================================================
    function AppointmentForm({ content, preselectedCategory }) {
      const t = content.appointment;
      const f = t.form;
      const val = t.validation;
      const conf = t.confirmation;

      const [formData, setFormData] = useState({
        fullName: '',
        phone: '',
        email: '',
        preferredDateTime: '',
        category: preselectedCategory || '',
        description: '',
        fileName: '',
        fileSize: '',
        disclaimerAccepted: false,
      });

      const [selectedFile, setSelectedFile] = useState(null);
      const [errors, setErrors] = useState({});
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [submissionSuccess, setSubmissionSuccess] = useState(false);
      const [submissionError, setSubmissionError] = useState('');
      const [copied, setCopied] = useState(false);

      useEffect(() => {
        if (preselectedCategory) {
          setFormData((prev) => ({ ...prev, category: preselectedCategory }));
        }
      }, [preselectedCategory]);

      const handleInputChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData((prev) => ({
          ...prev,
          [name]: type === 'checkbox' ? checked : value,
        }));
        if (errors[name]) {
          setErrors((prev) => ({ ...prev, [name]: '' }));
        }
      };

      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (!file) {
          setSelectedFile(null);
          setFormData((prev) => ({ ...prev, fileName: '', fileSize: '' }));
          return;
        }

        if (file.size > 15 * 1024 * 1024) {
          setErrors((prev) => ({ ...prev, file: val.fileTooLarge || 'File size exceeds 15 MB limit.' }));
          setSelectedFile(null);
          setFormData((prev) => ({ ...prev, fileName: '', fileSize: '' }));
          return;
        }

        const formattedSize = file.size > 1024 * 1024 
          ? (file.size / (1024 * 1024)).toFixed(2) + ' MB'
          : (file.size / 1024).toFixed(1) + ' KB';

        setErrors((prev) => ({ ...prev, file: '' }));
        setSelectedFile(file);
        setFormData((prev) => ({
          ...prev,
          fileName: file.name,
          fileSize: formattedSize,
        }));
      };

      const validateForm = () => {
        const newErrors = {};

        if (!formData.fullName.trim()) {
          newErrors.fullName = val.nameRequired;
        }

        const phoneRegex = /^[0-9+ \-()]{8,15}$/;
        if (!formData.phone.trim() || !phoneRegex.test(formData.phone.trim())) {
          newErrors.phone = val.phoneRequired;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!formData.email.trim() || !emailRegex.test(formData.email.trim())) {
          newErrors.email = val.emailRequired;
        }

        if (!formData.category) {
          newErrors.category = val.categoryRequired;
        }

        if (!formData.description.trim()) {
          newErrors.description = val.descriptionRequired;
        }

        if (!formData.disclaimerAccepted) {
          newErrors.disclaimerAccepted = val.disclaimerRequired;
        }

        setErrors(newErrors);
        return Object.keys(newErrors).length === 0;
      };

      const recipientEmail = 'adv.mohsinsayyed@gmail.com';

      const buildFullSummary = () => {
        return `LEGAL CONSULTATION APPOINTMENT REQUEST
==================================================
LAW CHAMBERS OF ADV. MOHSIN MOHAMMADALI SAYYED
Bombay High Court Advocate • Nashik Chambers
==================================================

1. CLIENT DETAILS:
   - Full Name: ${formData.fullName}
   - WhatsApp Phone: ${formData.phone}
   - Email Address: ${formData.email}
   - Preferred Date/Time: ${formData.preferredDateTime || 'Earliest available chamber slot'}

2. MATTER SPECIFICATIONS:
   - Practice Category: ${formData.category}
   - Case Brief & Key Facts:
${formData.description}

3. ATTACHED DOCUMENT:
   - Document: ${formData.fileName ? formData.fileName + ' (' + formData.fileSize + ')' : 'No file attached'}

4. STATUTORY ACKNOWLEDGEMENT:
   - BCI Disclaimer Accepted: YES (Voluntary Information Request)
   - Submission Timestamp: ${new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })}

==================================================
CONFIDENTIAL LEGAL BRIEF — PRIVILEGED COMMUNICATION`;
      };

      const emailSubject = `Legal Consultation Request: ${formData.category || 'New Matter'} - ${formData.fullName}`;
      const fullSummaryBody = buildFullSummary();

      const gmailComposeUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(recipientEmail)}&su=${encodeURIComponent(emailSubject)}&body=${encodeURIComponent(fullSummaryBody)}`;

      const whatsappText = `Hello Advocate Mohsin Sayyed, I am submitting a legal consultation request via your website.

${fullSummaryBody}

Please review the complete matter details above and contact me on WhatsApp regarding the next steps.`;

      const whatsappUrl = `https://wa.me/918956528026?text=${encodeURIComponent(whatsappText)}`;

      const downloadSelectedAttachment = () => {
        if (!selectedFile) return;
        const objectUrl = URL.createObjectURL(selectedFile);
        const downloadLink = document.createElement('a');
        downloadLink.href = objectUrl;
        downloadLink.download = selectedFile.name;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        downloadLink.remove();
        window.setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
      };

      const handleShareWithAttachment = async () => {
        if (!selectedFile || !navigator.share) return false;
        try {
          // Some WhatsApp share targets discard the Web Share `text` field
          // when a document is shared. Include the complete summary as a
          // second .txt attachment so the case details cannot be lost.
          const summaryFile = new File(
            [fullSummaryBody],
            `consultation-summary-${(formData.fullName || 'request').trim().replace(/[^a-z0-9]+/gi, '-').toLowerCase()}.txt`,
            { type: 'text/plain' }
          );
          const shareFiles = [selectedFile, summaryFile];
          const sharePayload = {
            title: 'Legal Consultation Request',
            text: whatsappText,
            files: shareFiles
          };
          if (navigator.canShare && !navigator.canShare({ files: shareFiles })) return false;
          await navigator.share(sharePayload);
          return true;
        } catch (err) {
          if (err?.name === 'AbortError') return true;
          return false;
        }
      };

      const handleWhatsAppClick = async (e) => {
        if (!selectedFile) return;
        e.preventDefault();
        const shared = await handleShareWithAttachment();
        if (shared) return;

        // WhatsApp Web links cannot carry local file attachments. Download the
        // document first, then open WhatsApp with the complete summary so the
        // user can add the downloaded file in the WhatsApp composer.
        downloadSelectedAttachment();
        window.setTimeout(() => {
          window.open(whatsappUrl, '_blank', 'noopener,noreferrer');
        }, 250);

        // allow a website to inject a local file into Gmail's composer.
        if (selectedFile) downloadSelectedAttachment();

                <div className="font-serif text-sm font-bold uppercase tracking-widest text-[#F7F3EA] mb-3 border-b border-[#6B1F2A] pb-1 inline-block">
                  Chambers Location
                </div>

                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />

                    </svg>

                  </div>
                  <div className="flex items-center gap-2.5">
                    <svg className="w-4 h-4 text-[#D0C2B2] flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />

            </div>

            <div className="pt-8 flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-[#D0C2B2]/80">
              <div className="text-center md:text-left space-y-1">

                <p className="text-[11px] opacity-75">{c.footerDisclaimer}</p>

                <button onClick={onReopenDisclaimer} className="text-[#D0C2B2] hover:text-white underline text-xs transition-colors cursor-pointer py-1.5">

    // =========================================================================
    // 13. FLOATING WHATSAPP BUTTON
    // =========================================================================
    function FloatingWhatsApp({ content }) {
      const tooltipText = content.contact?.floatingWaTooltip || "Chat on WhatsApp";

      return (
        <aside className="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 z-40">
          <a
            href="https://wa.me/918956528026?text=Hello%20Advocate%20Sayyed,%20I%20am%20visiting%20your%20website%20and%20would%20like%20to%20inquire%20about%20a%20legal%20consultation."
            target="_blank"
            rel="noopener noreferrer"
            className="group flex items-center gap-2.5 bg-[#25D366] hover:bg-[#1EBE5D] text-white p-3 sm:px-4 sm:py-3 rounded-full shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105 min-h-[48px] min-w-[48px]"
            title={tooltipText}
          >
            <svg className="w-6 h-6 fill-current flex-shrink-0" viewBox="0 0 24 24">
              <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.007c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.861.174.086.275.072.376-.044.101-.116.433-.506.549-.68.116-.173.231-.145.39-.086.159.058 1.011.477 1.184.564.173.087.289.13.332.203.043.072.043.419-.101.824z" />
            </svg>
            <span className="hidden sm:inline-block text-xs font-bold tracking-wide">WhatsApp</span>
          </a>
        </aside>

    // =========================================================================
    // 14. MAIN APP CONTROLLER
    // =========================================================================
    function App() {
      const [isLoading, setIsLoading] = useState(true);
      const [currentLang, setCurrentLang] = useState('en');
      const currentContent = content[currentLang] || content.en;
      const [isDisclaimerOpen, setIsDisclaimerOpen] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState('');

      useEffect(() => {
        // Hold for 600ms minimum to ensure calm, deliberate breathing motion
        const timer = setTimeout(() => {
          setIsLoading(false);
        }, 600);
        return () => clearTimeout(timer);
      }, []);

      useEffect(() => {
        try {
          const accepted = sessionStorage.getItem('bci_disclaimer_accepted');
          if (!accepted) {
            setIsDisclaimerOpen(true);
          }
        } catch (e) {
          setIsDisclaimerOpen(true);
        }
      }, []);

      useEffect(() => {
        document.title = currentContent.meta.title;
      }, [currentContent]);

      const handleAcceptDisclaimer = () => {
        try {
          sessionStorage.setItem('bci_disclaimer_accepted', 'true');
        } catch (e) {}
        setIsDisclaimerOpen(false);
      };

      const handleToggleLang = () => {
        setCurrentLang((prev) => (prev === 'en' ? 'mr' : 'en'));
      };

      const handleSelectPracticeArea = (areaTitle) => {
        setSelectedCategory(areaTitle);
        const el = document.querySelector('#appointment');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      const handleEmpanelmentInquiry = () => {
        setSelectedCategory('Bank / NBFC Empanelment Inquiry');
        const el = document.querySelector('#appointment');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      const handleBookClick = () => {
        const el = document.querySelector('#appointment');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      return (
        <div className="min-h-screen bg-[#F7F3EA] text-[#172033] font-sans antialiased selection:bg-[#6B1F2A] selection:text-white flex flex-col justify-between relative">
          {/* 1. Breathing Logo Loader on Initial Load */}
          <BreathingLogoLoader isLoading={isLoading} />

          {/* 2. Statutory BCI Disclaimer Gate */}
          <DisclaimerGate
            isOpen={isDisclaimerOpen}
            onAccept={handleAcceptDisclaimer}
            content={currentContent}
            currentLang={currentLang}
            onToggleLang={handleToggleLang}
          />

          {/* 3. Sticky Navigation */}
          <Navbar
            content={currentContent}
            currentLang={currentLang}
            onToggleLang={handleToggleLang}
          />

          {/* 4. Main Content Sections */}
          <main id="main-content" className="flex-grow">
            <Hero content={currentContent} onBookClick={handleBookClick} />
            <About content={currentContent} />
            <PracticeAreas content={currentContent} onSelectArea={handleSelectPracticeArea} />
            <WhyChooseUs content={currentContent} />
            <Empanelment content={currentContent} onEmpanelmentInquiry={handleEmpanelmentInquiry} />
            <AppointmentForm content={currentContent} preselectedCategory={selectedCategory} />
          </main>

          {/* 5. Footer & Floating Actions */}
          <Footer content={currentContent} onReopenDisclaimer={() => setIsDisclaimerOpen(true)} />
          <FloatingWhatsApp content={currentContent} />
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
